[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "earlyexperience-toolsandbox"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "tool-sandbox @ git+https://github.com/apple/ToolSandbox.git@165848b9a78cead7ca7fe7c89c688b58e6501219",
  "httpx<0.28",
]
[project.scripts]
ee-toolsandbox = "ee_toolsandbox.cli:main"
[dependency-groups]
dev = ["pytest>=8,<9", "ruff"]
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/ee_toolsandbox"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
