[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tau3-evolution"
version = "0.1.0"
description = "Standalone evolution pipeline for the tau3 core text benchmark"
requires-python = ">=3.10,<3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tau3_evolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
